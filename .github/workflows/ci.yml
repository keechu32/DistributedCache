name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode clean verify
      - run: python3 scripts/smoke.py
      - run: mvn --batch-mode -Pbenchmarks -DskipTests package
      - name: Benchmark smoke test
        run: java -jar target/jmh/distributed-cache-1.0-SNAPSHOT-benchmarks.jar '.*localGet' -foe true -wi 0 -i 1 -r 100ms -f 1
